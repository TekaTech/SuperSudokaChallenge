[data-theme="dark"] {
  --bg: #0F1B2D;
  --surface: #16273D;
  --surface-2: #1B3049;
  --ink: #E6F0FD;
  --given: #F2F7FF;
  --muted: #93AED0;
  --primary: #3A6EA5;
  --primary-strong: #5B8CC0;
  --entry: #7DB4F5;
  --cell: #152A44;
  --cell-box: #1A3353;
  --cell-rel: #1E3A5E;
  --cell-same: #2A4E7C;
  --line: #2A4767;
  --line-strong: #3A6EA5;
  --conflict-bg: #5A2326;
  --conflict-ink: #FF9D94;
  --chip: #1E3A5E;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "PingFang TC", "PingFang SC", "Microsoft JhengHei", "Noto Sans TC",
    "Heiti TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

* {
  box-sizing: border-box;
}

/* ---------- 動畫 ---------- */

@keyframes splash-bounce {
  0% {
    transform: scale(0.5);
  }

  55% {
    transform: scale(1.2);
  }

  75% {
    transform: scale(0.94);
  }

  100% {
    transform: scale(1);
  }
}

@keyframes ripple-out {
  0% {
    transform: scale(0.55);
    opacity: 0.75;
  }

  100% {
    transform: scale(2.3);
    opacity: 0;
  }
}

@keyframes fade-up {
  from {
    opacity: 0;
    transform: translateY(16px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fade-in {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

@keyframes shake-x {
  10%, 90% {
    transform: translateX(-2px);
  }

  20%, 80% {
    transform: translateX(3px);
  }

  30%, 50%, 70% {
    transform: translateX(-6px);
  }

  40%, 60% {
    transform: translateX(6px);
  }
}

@keyframes shine-sweep {
  0% {
    transform: translateX(-130%) skewX(-18deg);
    opacity: 0;
  }

  25% {
    opacity: 0.9;
  }

  100% {
    transform: translateX(260%) skewX(-18deg);
    opacity: 0;
  }
}

@keyframes pop-in {
  0% {
    transform: scale(0.6);
    opacity: 0;
  }

  70% {
    transform: scale(1.08);
    opacity: 1;
  }

  100% {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes clap-pop {
  0% {
    transform: scale(0.3) rotate(-16deg);
    opacity: 0;
  }

  35% {
    opacity: 1;
  }

  60% {
    transform: scale(1.3) rotate(10deg);
    opacity: 1;
  }

  100% {
    transform: scale(1) rotate(0deg);
    opacity: 1;
  }
}

@keyframes grid-win {
  0% {
    transform: scale(1);
  }

  40% {
    transform: scale(1.045);
  }

  100% {
    transform: scale(1);
  }
}

@keyframes flash-pulse {
  0% {
    opacity: 0;
  }

  30% {
    opacity: 0.85;
  }

  100% {
    opacity: 0;
  }
}

@keyframes spin-slow {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

.anim-splash-icon {
  animation: splash-bounce 2.5s cubic-bezier(0.34, 1.4, 0.64, 1) both;
}

.anim-ripple {
  animation: ripple-out 2.2s ease-out both;
}

.anim-fade-up {
  animation: fade-up 0.9s ease both;
}

.anim-fade-in {
  animation: fade-in 0.5s ease both;
}

.anim-shake {
  animation: shake-x 0.8s ease both;
}

.anim-pop {
  animation: pop-in 0.55s cubic-bezier(0.34, 1.4, 0.64, 1) both;
}

.anim-clap {
  animation: clap-pop 0.8s ease both;
}

.anim-grid-win {
  animation: grid-win 0.9s ease both;
}

.anim-flash {
  animation: flash-pulse 0.8s ease both;
}

.anim-spin-slow {
  animation: spin-slow 1.1s linear infinite;
}

.shine-band {
  background: linear-gradient(
    100deg,
    rgba(255, 255, 255, 0) 0%,
    rgba(190, 220, 255, 0.85) 35%,
    rgba(255, 255, 255, 0.95) 50%,
    rgba(140, 185, 240, 0.8) 65%,
    rgba(255, 255, 255, 0) 100%
  );
  animation: shine-sweep 1.6s ease-in-out both;
}

button {
  touch-action: manipulation;
  -moz-user-select: none;
       user-select: none;
  -webkit-user-select: none;
}

.disabled\:opacity-35:disabled {
  opacity: 0.35;
}

.disabled\:opacity-40:disabled {
  opacity: 0.4;
}

@media (min-width: 640px) {
  .sm\:items-center {
    align-items: center;
  }

  .sm\:rounded-3xl {
    border-radius: 1.5rem;
  }
}
</style>
